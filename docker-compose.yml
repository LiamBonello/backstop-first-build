services:
  postgres:
    image: postgres:18.6-alpine
    container_name: backstop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backstop
      POSTGRES_USER: backstop
      POSTGRES_PASSWORD: backstop
    ports:
      - "5433:5432"
    volumes:
      - backstop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstop -d backstop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backstop_postgres_data:
