services:
  - type: web
    name: backstop
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_NEON_AUTH_URL
        value: "https://ep-cold-morning-b13losv3.neonauth.c-5.eu-central-1.aws.neon.tech/backstop/auth"
      - key: NEON_AUTH_URL
        value: "https://ep-cold-morning-b13losv3.neonauth.c-5.eu-central-1.aws.neon.tech/backstop/auth"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_WEB_RISK_API_KEY
        sync: false
      - key: BACKSTOP_BROWSER_FALLBACK
        value: "0"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
