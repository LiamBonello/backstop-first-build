name: Verify dependency updates

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - src/**
      - server/**
      - tsconfig*.json
      - vite.config.ts

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      VITE_NEON_AUTH_URL: "https://ep-cold-morning-b13losv3.neonauth.c-5.eu-central-1.aws.neon.tech/backstop/auth"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Verify
        run: npm run verify

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync dependency lockfile"
          git push
